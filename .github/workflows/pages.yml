name: Deploy webapp to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      refresh_market_data:
        description: 'Refresh the saved market snapshot before deployment (scheduled runs always refresh)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/ledger-regressions.yml

  update-data-and-deploy:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update official ETF database
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_market_data) }}
        env:
          DATA_BATCH_DIR: webapp/data/batches
        run: node webapp/scripts/refresh-official-database.js

      - name: Save batch verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-batches
          path: webapp/data/batches
          if-no-files-found: warn

      - name: Validate available ETF database
        run: |
          node webapp/scripts/test-price-series-preservation.js
          node webapp/scripts/validate-etf-data.js

      - name: Commit refreshed database
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_market_data) }}
        run: |
          if [ -n "$(git status --porcelain webapp/data/etf-database.json webapp/data/batches)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add webapp/data/etf-database.json webapp/data/batches
            git commit -m "Update ETF database [skip ci]"
            git push
          fi

      - name: Build runtime API configuration
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          CONSULTATION_IG_URL: ${{ vars.CONSULTATION_IG_URL }}
          CONSULTATION_LINE_URL: ${{ vars.CONSULTATION_LINE_URL }}
          FULL_REPORT_PRICE_TWD: ${{ vars.FULL_REPORT_PRICE_TWD }}
          CONSULTATION_DEPOSIT_TWD: ${{ vars.CONSULTATION_DEPOSIT_TWD }}
          CONSULTATION_FEE_TWD: ${{ vars.CONSULTATION_FEE_TWD }}
        run: node webapp/scripts/build-runtime-config.js

      - name: Stage public files only
        run: node webapp/scripts/build-public-site.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
