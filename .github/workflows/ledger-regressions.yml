name: Ledger regression checks

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      runtime_only:
        description: 'Only verify the production Node 24 Alpine container, including real official first use'
        type: boolean
        default: false
      source_diagnostics:
        description: 'Only capture redacted public issuer diagnostics; not a release or financial acceptance test'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/**'
      - 'render.yaml'

permissions:
  contents: read

jobs:
  ledger:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.runtime_only && !inputs.source_diagnostics) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ledger, persistence, image guards and both browser sizes
        run: node webapp/scripts/run-ledger-regressions.js --browser
      - name: Verify updater preservation and candidate rejection
        run: node --test webapp/scripts/test-updater-guards.js webapp/scripts/test-data-batch.js webapp/scripts/test-market-snapshot.js webapp/scripts/test-market-reader.js webapp/scripts/test-payout-reconciliation.js
      - name: Verify selected holdings and empty-cache first use
        run: node --test webapp/scripts/test-portfolio-demand.js webapp/scripts/test-portfolio-first-use.js webapp/scripts/test-portfolio-domestic.js webapp/scripts/test-portfolio-valuation.js
      - name: Verify public mobile layout and accessibility
        shell: pwsh
        run: |
          $env:SMOKE_TEST = '1'
          $env:PORT = '5188'
          $server = Start-Process node -ArgumentList 'webapp/server.js' -WindowStyle Hidden -PassThru
          try {
            node webapp/scripts/test-market-accessibility.js http://127.0.0.1:5188/ accessibility-evidence
            if ($LASTEXITCODE -ne 0) { throw 'Public accessibility checks failed' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - name: Save accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-accessibility
          path: accessibility-evidence
          if-no-files-found: warn
  portfolio-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production Dockerfile without production credentials
        run: docker build -t portfolio-candidate ./webapp
      - name: Verify calculations, cache, parsing and error guards on Node 24 Alpine
        if: ${{ !inputs.source_diagnostics }}
        run: docker run --rm portfolio-candidate node --test scripts/test-portfolio-demand.js scripts/test-portfolio-first-use.js scripts/test-portfolio-domestic.js scripts/test-portfolio-valuation.js scripts/test-market-reader.js
      - name: Verify real official sources and empty-cache API on Node 24 Alpine
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_only && !inputs.source_diagnostics }}
        run: docker run --rm portfolio-candidate node scripts/verify-portfolio-runtime.js
      - name: Capture bounded redacted issuer diagnostics only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_diagnostics }}
        run: docker run --rm portfolio-candidate node scripts/diagnose-taishin-source.js
